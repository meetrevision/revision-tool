schema: revios_tweak_inventory.v1
yaml_mirror_of: lib/features/tweaks/inventory/tweak_inventory.dart
profiles:
  - compatibility
  - gaming
  - performance
  - extreme
controller_states:
  - enabled
  - disabled
  - blocked
  - failed
  - pendingReboot
  - unknown
  - managedByProfile
  - userOverride
  - dangerousPendingConfirmation
tweaks:
  - id: performance.powerplan
    category: Power Plan
    name: Revision ultra performance power plan
    technical_description: Creates and activates the Revision power scheme.
    expected_impact: Improves CPU response and disables selected AC power saving behavior.
    risk: medium
    profiles: [gaming, performance, extreme]
    dependencies: [Administrator rights, powercfg.exe, AC power guard for laptops]
    detection: PerformanceService.statusReviPowerPlan
    apply: PerformanceService.enableReviPowerPlan
    verify: PerformanceService.statusReviPowerPlan
    rollback: PerformanceService.disableReviPowerPlan
    logs: Log detection input, requested action, exit code, registry writes, verification result, and rollback snapshot id.
    reason: Gaming and higher profiles need an existing aggressive AC power baseline.
    warnings: [May require restart or sign out before verification is final.]
    evidence: [lib/features/tweaks/performance/performance_service.dart, playbook/src/Configuration/Tasks/start.yml]
  - id: performance.powerplan-states-c6
    category: CPU
    name: C-state latency tuning
    technical_description: Changes Revision power plan idle promote and demote thresholds.
    expected_impact: Reduces latency from deep idle transitions on tuned desktop systems.
    risk: high
    profiles: [gaming, performance, extreme]
    dependencies: [Administrator rights, powercfg.exe, AC power guard for laptops]
    detection: PerformanceService.statusReviPowerPlanC6States
    apply: PerformanceService.enableReviPowerPlanC6States
    verify: PerformanceService.statusReviPowerPlanC6States
    rollback: PerformanceService.disableReviPowerPlanC6States
    logs: Log detection input, requested action, exit code, registry writes, verification result, and rollback snapshot id.
    reason: Gaming and Performance profiles prioritize latency over idle efficiency.
    warnings: [Guard with hardware and workload detection before profile automation.]
    evidence: [lib/features/tweaks/performance/performance_service.dart]
  - id: performance.superfetch
    category: Services
    name: SysMain and Superfetch
    technical_description: Controls SysMain, ReadyBoost, prefetcher, and related cache policy values.
    expected_impact: Can reduce background disk and memory churn on SSD-focused systems.
    risk: high
    profiles: [performance, extreme]
    dependencies: [Administrator rights, Windows registry access]
    detection: PerformanceService.statusSuperfetch
    apply: PerformanceService.disableSuperfetch
    verify: PerformanceService.statusSuperfetch
    rollback: PerformanceService.enableSuperfetch
    logs: Log detection input, requested action, exit code, registry writes, verification result, and rollback snapshot id.
    reason: Performance profile can trade Windows caching behavior for lower background load.
    warnings: [Guard with hardware and workload detection before profile automation.]
    evidence: [lib/features/tweaks/performance/performance_service.dart]
  - id: performance.memory-compression
    category: RAM
    name: Memory Compression
    technical_description: Uses Enable-MMAgent and Disable-MMAgent to control Windows memory compression.
    expected_impact: Can reduce CPU overhead at the cost of higher memory pressure.
    risk: high
    profiles: [performance, extreme]
    dependencies: [Administrator rights, PowerShell MMAgent, RAM capacity guard]
    detection: PerformanceService.statusMemoryCompression
    apply: PerformanceService.disableMemoryCompression
    verify: PerformanceService.statusMemoryCompression
    rollback: PerformanceService.enableMemoryCompression
    logs: Log detection input, requested action, exit code, registry writes, verification result, and rollback snapshot id.
    reason: Performance and Extreme may disable it only when memory headroom is adequate.
    warnings: [Guard with hardware and workload detection before profile automation.]
    evidence: [lib/features/tweaks/performance/performance_service.dart]
  - id: performance.intel-tsx
    category: Intel
    name: Intel TSX
    technical_description: Controls the DisableTsx kernel registry value for compatible Intel CPUs.
    expected_impact: May improve specific transactional memory workloads and benchmarks.
    risk: dangerous
    profiles: [extreme]
    dependencies: [Intel CPU guard, Administrator rights, Reboot]
    detection: PerformanceService.statusIntelTSX
    apply: PerformanceService.enableIntelTSX
    verify: PerformanceService.statusIntelTSX
    rollback: PerformanceService.disableIntelTSX
