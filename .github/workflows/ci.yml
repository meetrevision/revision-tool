name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Analyze & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: src

      - name: Generate localization
        run: dart run slang
        working-directory: src

      - name: Compile SVG vectors
        shell: pwsh
        working-directory: src
        run: |
          $svgRoot = "assets/icon/pane"
          if (-not (Test-Path -Path $svgRoot)) {
            throw "SVG root not found: $svgRoot"
          }

          $svgs = Get-ChildItem -Path $svgRoot -Filter *.svg -Recurse -File
          foreach ($svg in $svgs) {
            $inputPath = $svg.FullName
            $outputPath = "$inputPath.vec"
            Write-Host "Compiling $($svg.FullName) -> $outputPath"
            dart run vector_graphics_compiler -i "$inputPath" -o "$outputPath"
          }

      - name: Generate code
        run: dart run build_runner build --force-aot
        working-directory: src

      - name: Analyze
        run: flutter analyze
        working-directory: src

      - name: Test
        run: flutter test --reporter=expanded --dart-define=SKIP_INTEGRATION=true
        working-directory: src
